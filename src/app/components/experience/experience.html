<section id="experience" class="portfolio-section experience-section" aria-labelledby="experience-title">
    <div class="section-inner">
        <p class="section-kicker">CAREER</p>
        <h2 id="experience-title" class="portfolio-title">Professional experience</h2>
        <div class="experience-list">
            @for (role of roles; track role.company) {
            <article class="experience-item">
                <div class="experience-meta">
                    <h3>{{ role.title }}</h3>
                    <p>{{ role.company }}</p>
                    <span class="experience-date">{{ role.dates }}</span>
                </div>
                <ul class="experience-highlights">
                    @for (highlight of role.highlights; track highlight) {
                    <li>{{ highlight }}</li>
                    }
                </ul>
            </article>
            }
        </div>
    </div>
</section>
