<section id="projects" class="portfolio-section projects-section" aria-labelledby="projects-title">
    <div class="section-inner">
        <p class="section-kicker">SELECTED WORK</p>
        <h2 id="projects-title" class="portfolio-title">Featured projects</h2>
        <div class="featured-projects-grid">
            @for (project of projects; track project.title) {
            <article class="featured-project-card">
                <span class="project-index" aria-hidden="true"></span>
                <p class="project-company">{{ project.company }}</p>
                <h3>{{ project.title }}</h3>
                <p class="project-description">{{ project.description }}</p>
                <ul class="project-highlights">
                    @for (highlight of project.highlights; track highlight) {
                    <li>{{ highlight }}</li>
                    }
                </ul>
                <p class="project-stack"><strong>Stack:</strong> {{ project.stack }}</p>
            </article>
            }
        </div>
    </div>
</section>
