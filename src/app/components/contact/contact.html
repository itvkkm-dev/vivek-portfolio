<div class="contact-page-wrapper" data-aos="fade-up" data-aos-duration="800">
    <div class="contact-page">
        <h2 class="section-title" data-aos="fade-right" data-aos-delay="100">
            <i class="fas fa-paper-plane"></i> Let's Connect
        </h2>

        <div class="contact-methods">
            <!-- WhatsApp -->
            <a [href]="whatsappLink" target="_blank" class="contact-link whatsapp" rel="noopener noreferrer"
                data-aos="zoom-in" data-aos-delay="200">
                <i class="fab fa-whatsapp"></i>
                <span>WhatsApp</span>
            </a>

            <!-- LinkedIn -->
            <a href="https://www.linkedin.com/in/vivek-kumar-252329273?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app"
                target="_blank" class="contact-link linkedin" rel="noopener noreferrer" data-aos="zoom-in"
                data-aos-delay="300">
                <i class="fab fa-linkedin"></i>
                <span>LinkedIn</span>
            </a>
        </div>

        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" novalidate class="contact-form" data-aos="fade-up"
            data-aos-delay="400">
            <div class="form-group" data-aos="fade-right" data-aos-delay="450">
                <input type="text" formControlName="name" placeholder="Full Name" />
                <div *ngIf="contactForm.get('name')?.touched && contactForm.get('name')?.invalid" class="error-msg">
                    Name is <strong>required</strong>.
                </div>
            </div>

            <div class="form-group" data-aos="fade-right" data-aos-delay="500">
                <input type="text" formControlName="subject" placeholder="Subject" />
                <div *ngIf="contactForm.get('subject')?.touched && contactForm.get('subject')?.invalid"
                    class="error-msg">
                    Subject is <strong>required</strong>.
                </div>
            </div>

            <div class="form-group" data-aos="fade-right" data-aos-delay="550">
                <textarea formControlName="message" placeholder="Your Message" rows="5"></textarea>
                <div *ngIf="contactForm.get('message')?.touched && contactForm.get('message')?.invalid"
                    class="error-msg">
                    Message is <strong>required</strong>.
                </div>
            </div>

            <button type="submit" [disabled]="contactForm.invalid" class="submit-btn" data-aos="zoom-in"
                data-aos-delay="600">
                <i class="fas fa-envelope"></i>
                <span>Send Email</span>
            </button>
        </form>
    </div>
</div>
<footer class="footer" data-aos-delay="700">
    <div class="footer-content">
        <p>
            Made with <span class="heart">♥</span> by <strong>Vivek</strong>
        </p>
        <p>&copy; {{ currentYear }} All rights reserved.</p>
    </div>
</footer>
