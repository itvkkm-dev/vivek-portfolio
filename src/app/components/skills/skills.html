<section id="skills" class="portfolio-section skills-section" aria-labelledby="skills-title">
    <div class="section-inner">
        <p class="section-kicker">TECHNICAL TOOLKIT</p>
        <h2 id="skills-title" class="portfolio-title">Skills</h2>
        <div class="skill-groups-grid">
            @for (category of categories; track category.title) {
            <article class="skill-group">
                <h3>{{ category.title }}</h3>
                <div class="skill-tags">
                    @for (skill of category.skills; track skill) {
                    <span class="skill-tag">{{ skill }}</span>
                    }
                </div>
            </article>
            }
        </div>
    </div>
</section>
